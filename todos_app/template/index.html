{% extends "base.html" %}
{% block content %}
    <main>
        <a href="/"><p class="head_img"></p></a>
        <h4>나를 성장시키는 메모</h4>
        <br>
    <form action="/add" method="post">
        <!-- <textarea name="task" rows="5" placeholder="Enter your task" id="task" required></textarea> -->
        <textarea name="task" rows="5" placeholder="Enter your task" id="task"></textarea>
        <button type="submit" id="add_task">
          Add
        </button>
    </form>

	    <br>
	    <h2>Tasks</h2>

	    <div>
      {% if todos == 0 %}
        <br>
        <p> 입력한 TODO 메모가 없습니다. </p>
      {% else %}
        {% for todo in todos %}
        <div class="task">
            <span class="task-text {% if todo.completed %}completed{% endif %}">{{ todo.task }}</span>
                <div class="task-actions">
                    <a href="/edit/{{ todo.id }}" class="todo-btn">Edit</a>
                    <form class="delete-form" action="/delete/{{ todo.id }}" method="post">
                        <button type="submit" class="todo-btn">Delete</button>
                    </form>
                </div>
        </div>
        {% endfor %}
      {% endif %}
	    </div>
    </main>
    <script src="/static/js/main.js"></script>
{% endblock content %}
